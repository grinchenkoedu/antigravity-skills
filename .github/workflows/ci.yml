name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell script syntax check
        run: |
          bash -n bin/gku-survey bin/gku-guard install.sh evals/*.sh evals/*/*.sh

      - name: ShellCheck lint
        run: |
          shellcheck -s bash -S warning bin/gku-survey bin/gku-guard install.sh evals/*.sh evals/*/*.sh

      - name: Run evaluation test suites
        run: |
          bash evals/run-all.sh

      - name: Test installer
        run: |
          bash ./install.sh
